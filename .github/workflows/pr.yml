# O portão dos pull requests, no molde do `pr.yml` do Festival dos Macacos
# (ADR 0016). É aqui que a suíte inteira roda: os tipos, o `pnpm check`, o
# build, o Storybook, as stories e o e2e. Na máquina, quem muda o código roda
# só a menor prova do que mudou (`node scripts/prova-minima.ts`), e o hook de
# push, os testes afetados; o resto fica para este workflow.
#
# Três jobs em paralelo, cada um num runner: o `check`, as `stories` e o
# `e2e`. O `suite-noturna.yml` chama este mesmo workflow toda noite, na `main`.
#
# Todo job tem `timeout-minutes`: sem ele, um job travado segura o PR pelas
# seis horas padrão do GitHub.
name: PR

'on':
  pull_request:
  workflow_call:

permissions:
  contents: read

# Um push novo no mesmo PR cancela a rodada anterior: o e2e leva minutos, e o
# resultado que conta é o do último commit.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Os tipos e o mesmo `pnpm check` da máquina (ADR 0002 e 0005): formato,
  # lint e tipos (`vp check`), as pastas, os testes com o piso de cobertura,
  # a fallow e o React Doctor.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # A `fallow health` conta quanto cada arquivo mudou nos últimos
          # meses. Com o clone raso de um commit só, o score daqui sairia
          # diferente do da máquina.
          fetch-depth: 0

      # Sem `version`, a ação lê o `packageManager` do `package.json` da raiz.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O `tsc` de cada pacote, com os diagnósticos do Effect (ADR 0004).
      - name: Tipos
        run: pnpm typecheck

      - name: Check
        run: pnpm check

  # Cada story num Chrome de verdade, no celular e no desktop
  # (`frontend/vitest.stories.config.ts`), com o Chrome da imagem ubuntu.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do Storybook
        run: pnpm build-storybook

      - name: Testes das stories
        run: pnpm test:stories

      # O manager do Storybook de pé: a busca sem acento (ADR 0037).
      - name: Teste do Storybook
        run: pnpm test:storybook

      - name: Guardar capturas das stories
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stories-falhas
          path: frontend/.vitest/
          if-no-files-found: ignore
          retention-days: 14

  # O build do site, como o deploy o faz, e o e2e. Ficam no mesmo job porque
  # o e2e builda de novo, com o acervo de fixture, no mesmo `.output`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O build confere o sitemap que está no ar: um caminho publicado que
      # sumiu sem `antes` derruba o passo (`frontend/vite/acervo.ts`). Antes
      # do primeiro deploy não há sitemap, e o build segue sem a conferência.
      - name: Build
        run: |
          # O `<urlset` separa o sitemap de uma página de domínio estacionado.
          if curl -fsSL --max-time 20 https://temestudo.cloud/sitemap.xml -o "$RUNNER_TEMP/sitemap-anterior.xml" \
            && grep -q '<urlset' "$RUNNER_TEMP/sitemap-anterior.xml"; then
            export SITEMAP_ANTERIOR="$RUNNER_TEMP/sitemap-anterior.xml"
          else
            echo "::warning::Não baixei https://temestudo.cloud/sitemap.xml; o build não confere os caminhos publicados."
          fi
          pnpm build

      # O `playwright.config.ts` usa o Chrome da máquina (`channel: 'chrome'`),
      # e a imagem ubuntu do GitHub já traz o Google Chrome.
      - name: E2E
        run: pnpm e2e

      # O trace e a captura de tela do que falhou, em `test-results/`.
      - name: Guardar traces do e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

# The pull request gate, modeled on the Festival dos Macacos `pr.yml` (ADR
# 0016). This is where the whole suite runs: types, `pnpm check`, the build,
# Storybook, the stories and e2e. On the machine, whoever changes code runs
# only the minimal proof of what changed (`node scripts/minimal-proof.ts`),
# and the push hook runs the affected tests; the rest is left to this
# workflow.
#
# Three jobs in parallel, each on its own runner: `check`, `stories` and
# `e2e`. `nightly-suite.yml` calls this same workflow every night, on `main`.
#
# Every job has `timeout-minutes`: without it, a stuck job holds the PR for
# GitHub's default six hours.
name: PR

'on':
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to the same PR cancels the previous run: e2e takes minutes, and
# the result that counts is the one for the last commit.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Types and the same `pnpm check` as the machine (ADR 0002 and 0005):
  # format, lint and types (`vp check`), the folders, the tests with the
  # coverage floor, fallow and React Doctor.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `fallow health` counts how much each file changed in recent
          # months. With a single-commit shallow clone, the score here would
          # differ from the machine's.
          fetch-depth: 0

      # Without `version`, the action reads `packageManager` from the root
      # `package.json`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's `tsc`, with the Effect diagnostics (ADR 0004).
      - name: Types
        run: pnpm typecheck

      - name: Check
        run: pnpm check

  # Each story in a real Chrome, on phone and desktop
  # (`frontend/vitest.stories.config.ts`), with the ubuntu image's Chrome.
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Story tests
        run: pnpm test:stories

      # The Storybook manager up and running: accent-insensitive search
      # (ADR 0037).
      - name: Storybook test
        run: pnpm test:storybook

      - name: Upload story screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stories-failures
          path: frontend/.vitest/
          if-no-files-found: ignore
          retention-days: 14

  # The site build, as deploy does it, and e2e. They share a job because e2e
  # builds again, with the fixture library, into the same `.output`.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build checks the live sitemap: a published path that disappeared
      # without `antes` fails the step (`frontend/vite/library.ts`). Before the
      # first deploy there is no sitemap, and the build goes on without the
      # check.
      - name: Build
        run: |
          # `<urlset` tells the sitemap apart from a parked-domain page.
          if curl -fsSL --max-time 20 https://temestudo.cloud/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" \
            && grep -q '<urlset' "$RUNNER_TEMP/previous-sitemap.xml"; then
            export SITEMAP_ANTERIOR="$RUNNER_TEMP/previous-sitemap.xml"
          else
            echo "::warning::Could not download https://temestudo.cloud/sitemap.xml; the build does not check published paths."
          fi
          pnpm build

      # `playwright.config.ts` uses the machine's Chrome (`channel: 'chrome'`),
      # and GitHub's ubuntu image already ships Google Chrome.
      - name: E2E
        run: pnpm e2e

      # The trace and screenshot of what failed, in `test-results/`.
      - name: Upload e2e traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

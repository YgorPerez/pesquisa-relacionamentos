# Os testes e o build em cada PR e em cada push na main, no molde do `pr.yml`
# do Festival dos Macacos. O deploy é o `deploy.yml`.
name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um push novo na mesma branch cancela a rodada anterior: o resultado que
# conta é o do último commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # A `fallow health` do `pnpm check` conta quanto cada arquivo mudou
          # nos últimos meses, e o score entra nessa conta. Com o clone raso
          # de um commit só, o score daqui sairia diferente do da máquina.
          fetch-depth: 0

      # Sem `version`, a ação lê o `packageManager` do `package.json` da raiz.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # O `tsc` de cada pacote, com os diagnósticos do Effect (ADR 0004).
      - name: Tipos
        run: pnpm typecheck

      # O mesmo `pnpm check` da máquina (ADR 0002 e 0005): formato, lint e
      # tipos (`vp check`), os testes com o piso de cobertura, a fallow e o
      # React Doctor.
      - name: Check
        run: pnpm check

      # O build confere o sitemap que está no ar: um caminho publicado que
      # sumiu sem `antes` derruba o passo (`frontend/vite/acervo.ts`). Antes
      # do primeiro deploy não há sitemap, e o build segue sem a conferência.
      - name: Build
        run: |
          # O `<urlset` separa o sitemap de uma página de domínio estacionado.
          if curl -fsSL --max-time 20 https://temestudo.com/sitemap.xml -o "$RUNNER_TEMP/sitemap-anterior.xml" \
            && grep -q '<urlset' "$RUNNER_TEMP/sitemap-anterior.xml"; then
            export SITEMAP_ANTERIOR="$RUNNER_TEMP/sitemap-anterior.xml"
          else
            echo "::warning::Não baixei https://temestudo.com/sitemap.xml; o build não confere os caminhos publicados."
          fi
          pnpm build

      - name: Build do Storybook
        run: pnpm build-storybook

      # Cada story num Chrome de verdade, no celular e no desktop
      # (`frontend/vitest.stories.config.ts`), com o Chrome da imagem ubuntu.
      - name: Testes das stories
        run: pnpm test:stories

      - name: Guardar capturas das stories
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: stories-falhas
          path: frontend/.vitest/
          if-no-files-found: ignore
          retention-days: 14

      # O `playwright.config.ts` usa o Chrome da máquina (`channel: 'chrome'`),
      # e a imagem ubuntu do GitHub já traz o Google Chrome.
      - name: E2E
        run: pnpm e2e

      # O trace e a captura de tela do que falhou, em `test-results/`.
      - name: Guardar traces do e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

# The README badges: the `fallow health` grade, the React Doctor score and
# line coverage (ADR 0023). Runs after each push to `main` that touches code,
# measures again and writes the result to `docs/badges/*.svg`
# (`.github/scripts/badges.ts`). The README only points at the SVG, so no
# number is written by hand.
#
# The same commands as `pnpm check`, minus the gate: fallow runs with
# `--min-score 0`, which never fails, because the PR is what enforces the
# grade. React Doctor runs without `--no-score`, unlike `check`: the score
# comes from its API, and without it the score is `null`.
name: Badges

'on':
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/badges.yml'
      - '.github/scripts/badges.ts'
  workflow_dispatch:

# The badge commit goes back to `main` with the workflow's own token, which
# does not trigger other workflows: deploy does not run because of it.
permissions:
  contents: write

jobs:
  medir-e-gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's coverage, which also gives fallow the exact CRAP of
      # each function.
      - name: Measure
        run: |
          pnpm exec vp run -r test:coverage
          pnpm exec vp test run --coverage
          cd frontend
          pnpm exec fallow health --coverage coverage/coverage-final.json --min-score 0 --format json > coverage/health.json
          pnpm exec react-doctor --json --no-supply-chain -y --json-out coverage/doctor.json

      - name: Write the badges
        run: node .github/scripts/badges.ts

      # Commits only if some badge changed. `main` gets pushes from several
      # sessions, hence the rebase with retries before pushing.
      - name: Commit the badges
        run: |
          git add docs/badges
          if git diff --cached --quiet; then
            echo "Badges match main; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Badges: follow ${GITHUB_SHA::7}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 15
          done
          exit 1

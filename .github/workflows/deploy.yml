# Each merge into main publishes the site at https://temestudo.cloud (spec
# #23, "Deploy"; `docs/deploy.md`). The `testes-e-build` job runs the tests
# and the content build. `publicar` sends that same build to the VPS over
# SSH, and `frontend/scripts/vps.ts` swaps the container without taking the
# site down and ensures the GoatCounter container at stats.temestudo.cloud.
#
# Without the `VPS_*` secrets, `publicar` is skipped with a warning, and the
# workflow ends green. They come in through `frontend/scripts/deploy-wizard.sh`.
name: Deploy

'on':
  push:
    branches: [main]
    # What changes the site. A docs-only commit publishes nothing.
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'estudos/**'
      - 'guias/**'
      - 'dicas/**'
      - 'dados/**'
      - 'relatorios/**'
      - 'fontes/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  # From the Actions tab: publishes the current main, or, with `voltar`,
  # switches to an image the VPS kept ("anterior" for the one from the
  # previous deploy).
  workflow_dispatch:
    inputs:
      voltar:
        description: 'Roll back to a version: "anterior" (the previous one) or the SHA. Empty publishes main.'
        type: string
        default: ''

permissions:
  contents: read

# One deploy at a time, and the newest waits for the previous one instead of
# cutting it off mid-swap.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Secrets cannot go in an `if:`. This job says whether they exist.
  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy skipped::Missing the VPS_HOST, VPS_USER and VPS_SSH_KEY secrets (VPS_PORT is optional). Run frontend/scripts/deploy-wizard.sh. Nothing was published."
          fi

  testes-e-build:
    if: inputs.voltar == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # `pnpm e2e` builds on top of the fixture content
      # (`frontend/e2e/library`) and runs Playwright on it.
      - name: E2E
        run: pnpm e2e

      - name: Upload e2e traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # The build that goes to the VPS, with the repository's library. It
      # comes after e2e, which left the fixture build in `.output`. Content
      # with an error fails this step, and nothing is published. It checks
      # the live sitemap: a published path that disappeared without `antes`
      # also fails it (`frontend/vite/library.ts`). Before the first deploy
      # there is no sitemap, and the build goes on without the check.
      - name: Build the content
        run: |
          # `<urlset` tells the sitemap apart from a parked-domain page.
          if curl -fsSL --max-time 20 https://temestudo.cloud/sitemap.xml -o "$RUNNER_TEMP/previous-sitemap.xml" \
            && grep -q '<urlset' "$RUNNER_TEMP/previous-sitemap.xml"; then
            export SITEMAP_ANTERIOR="$RUNNER_TEMP/previous-sitemap.xml"
          else
            echo "::warning::Could not download https://temestudo.cloud/sitemap.xml; the build does not check published paths."
          fi
          pnpm build

      # upload-artifact skips dot folders, like `.output`: it goes in a tar.
      - name: Pack the build
        run: tar -czf build.tar.gz -C frontend .output

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar.gz
          retention-days: 7

  publicar:
    needs: [segredos, testes-e-build]
    if: needs.segredos.outputs.ready == 'true' && inputs.voltar == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: producao
      url: https://temestudo.cloud
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `scripts/vps.ts` reads its variables through `scripts/env.ts`, which
      # imports `@t3-oss/env-core`: without installing, node cannot find it.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: frontend

      - name: Unpack the build
        run: tar -xzf build.tar.gz && rm build.tar.gz

      - name: Publish to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # The login the first deploy creates in GoatCounter. Without the
          # repository variable, it is admin@temestudo.cloud.
          GOATCOUNTER_EMAIL: ${{ vars.GOATCOUNTER_EMAIL }}
        run: node scripts/vps.ts --publish .output "$GITHUB_SHA"

      # From outside, over the internet (ADR 0008): the page arrives with
      # Referrer-Policy, each asset it cites arrives with its own type, and
      # not as HTML, and http leads to https with the query kept.
      - name: Verify the live site
        run: node scripts/check-live.ts temestudo.cloud "$GITHUB_SHA"

      # GoatCounter (#35) goes up along with it, but the site stays up
      # without it: a problem here becomes a warning. Before the wizard's
      # login step, it responds, but with no site created yet.
      - name: Verify GoatCounter
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://stats.temestudo.cloud/ || true)
          case "$status" in
            2??|3??) echo "stats.temestudo.cloud responds $status." ;;
            *) echo "::warning title=GoatCounter::https://stats.temestudo.cloud/ responded '${status:-nothing}'. See docs/deploy.md, GoatCounter section." ;;
          esac

  voltar:
    needs: segredos
    if: needs.segredos.outputs.ready == 'true' && inputs.voltar != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: producao
      url: https://temestudo.cloud
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The same `scripts/vps.ts` as `publicar`, which needs the dependencies.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Roll back to the requested version
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          ROLLBACK_TO: ${{ inputs.voltar }}
        run: |
          if [ "$ROLLBACK_TO" = anterior ]; then
            node scripts/vps.ts --rollback
          else
            node scripts/vps.ts --rollback "$ROLLBACK_TO"
          fi

      - name: Verify the live site
        run: node scripts/check-live.ts temestudo.cloud "$GITHUB_SHA"

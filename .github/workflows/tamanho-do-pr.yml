# O tamanho do PR vira rótulo, de `tamanho:PP` a `tamanho:XG`
# (`.github/scripts/tamanho-do-pr.ts`, ADR 0024). Só rotula, nunca reprova: um
# PR grande às vezes é o certo, e quem decide isso é quem revisa.
#
# Fica fora do `pr.yml` porque precisa escrever no PR, e o `pr.yml` só lê.
name: Tamanho do PR

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # Pôr e tirar o rótulo do PR, e criar o rótulo na primeira vez.
  issues: write
  pull-requests: write

concurrency:
  group: tamanho-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tamanho:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          # O script compara com o ponto em que o PR saiu da base.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rótulo de tamanho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ROTULOS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: origin/${{ github.base_ref }}
        run: node .github/scripts/tamanho-do-pr.ts "$BASE"

# Rascunho do arquivo de Prioridades (#33), com os números do protótipo do #9.
# O `_` no nome deixa o arquivo fora do build: as Fichas citadas ainda são ⬜
# e o build só aceita dado que cite Ficha ✅ ou 🟡. Quando o #39 refizer as
# Fichas, confira cada célula contra a Ficha nova e renomeie este arquivo e o
# `.meta.yaml` sem o `_`.
#
# Por característica × desfecho: `degrau` (3 pesa, 2 pesa pouco, 1 quase nada,
# 0 não sabemos), `medida`, `texto_simples` e `ficha`. Degrau acima de 0
# precisa de Ficha. `vies` é a distância entre o que se declara e o que se
# escolhe: `todos`, ou `homem` e `mulher`.

# A barra da Joel 2020: o que explica a satisfação com a relação.
satisfacao_explicada:
  ficha: joel-2020-machine-learning-43-datasets
  relacao: 45
  parceiro: 5
  sem_explicacao: 50

caracteristicas:
  - id: aparencia
    nome: Aparência
    atracao:
      degrau: 3
      medida: "r ≈ 0,40"
      texto_simples: Quem é mais bonito atrai mais, para homens e mulheres igualmente.
      ficha: eastwick-2014-meta-analise-preferencias
    satisfacao:
      degrau: 2
      medida: "r = 0,10, só maridos, só no início"
      texto_simples: No casamento, só os maridos ficam um pouco mais satisfeitos, e só no começo. Para as esposas, nada.
      ficha: meltzer-2014-atratividade-casamento
    duracao:
      degrau: 0
      medida: "HR 1,29 (estudo fraco)"
      texto_simples: 'Só um estudo fraco: quem disse ter casado "pela aparência" se divorciou mais.'
      ficha: francis-tan-2015-gastos-casamento-divorcio
    vies:
      todos: As pessoas dão menos peso à aparência quando dizem o que querem do que quando de fato se atraem.

  - id: sexo
    nome: Química sexual
    atracao:
      degrau: 3
      medida: "1º de 35 no revelado, 12º no declarado"
      texto_simples: '"Bom de cama" é o que mais pesa no que as pessoas revelam, e só o 12º no que dizem.'
      ficha: eastwick-2024-preferencias-43-paises
    satisfacao:
      degrau: 3
      medida: entre os 5 melhores preditores
      texto_simples: A satisfação sexual está entre o que mais prevê satisfação, mas ela se constrói a dois, não vem pronta no parceiro.
      ficha: joel-2020-machine-learning-43-datasets
    duracao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    vies:
      todos: É o item que as pessoas mais subestimam ao dizer o que querem.

  - id: renda
    nome: Renda
    atracao:
      degrau: 2
      medida: "r ≈ 0,10"
      texto_simples: Pesa pouco na atração, igual para homens e mulheres.
      ficha: eastwick-2014-meta-analise-preferencias
    satisfacao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede a renda do parceiro e a satisfação.
    duracao:
      degrau: 0
      medida: patrimônio do casal
      texto_simples: O que se associa a menos divórcio é o patrimônio do casal, não a renda de um. Não diz nada sobre escolher.
      ficha: killewald-2023-riqueza-divorcio
    vies:
      mulher: Mulheres tendem a dar mais peso à renda quando dizem o que querem do que quando escolhem.
      homem: Homens tendem a dar menos peso à renda quando dizem o que querem do que quando escolhem.

  - id: calma
    nome: Estabilidade emocional
    atracao:
      degrau: 2
      medida: mais baixo no revelado que no declarado
      texto_simples: No primeiro contato, pesa menos do que as pessoas dizem.
      ficha: eastwick-2024-preferencias-43-paises
    satisfacao:
      degrau: 2
      medida: "personalidade toda do parceiro: 1% a 3%"
      texto_simples: É o traço do parceiro com o resultado mais consistente. Mesmo assim, a personalidade inteira do parceiro explica de 1% a 3% da satisfação.
      ficha: dyrenforth-2010-personalidade-similaridade
    duracao:
      degrau: 1
      texto_simples: Para o fim de namoros, a personalidade quase não prevê.
      ficha: le-2010-preditores-termino

  - id: gentileza
    nome: Gentileza
    atracao:
      degrau: 0
      texto_simples: Os estudos lidos não separam isso.
    satisfacao:
      degrau: 2
      medida: "personalidade toda do parceiro: 1% a 3%"
      texto_simples: Parceiros mais gentis se associam a mais satisfação, num efeito pequeno.
      ficha: malouff-2010-personalidade-parceiro
    duracao:
      degrau: 1
      texto_simples: Para o fim de namoros, a personalidade quase não prevê.
      ficha: le-2010-preditores-termino

  - id: responsavel
    nome: Ser responsável
    atracao:
      degrau: 0
      texto_simples: Os estudos lidos não separam isso.
    satisfacao:
      degrau: 2
      medida: "personalidade toda do parceiro: 1% a 3%"
      texto_simples: Parceiros mais responsáveis se associam a mais satisfação, num efeito pequeno.
      ficha: malouff-2010-personalidade-parceiro
    duracao:
      degrau: 1
      texto_simples: Para o fim de namoros, a personalidade quase não prevê.
      ficha: le-2010-preditores-termino

  - id: parecido
    nome: Ser parecido comigo
    atracao:
      degrau: 1
      medida: "real: nulo; percebida: prevê"
      texto_simples: Ser parecido de fato não prevê atração em quem já está junto. Sentir-se parecido, sim.
      ficha: montoya-2008-similaridade-real-percebida
    satisfacao:
      degrau: 1
      medida: "< 0,5%"
      texto_simples: Ter personalidades parecidas explica menos de 0,5% da satisfação.
      ficha: dyrenforth-2010-personalidade-similaridade
    duracao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.

  - id: escolaridade
    nome: Mesma escolaridade
    atracao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    satisfacao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    duracao:
      degrau: 2
      medida: "HR 0,78"
      texto_simples: Nos EUA recentes, casais com a mesma escolaridade se divorciam um pouco menos.
      ficha: schwartz-2014-homogamia-educacional

  - id: religiao
    nome: Mesma religião
    atracao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    satisfacao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    duracao:
      degrau: 2
      texto_simples: Uniões entre religiões diferentes se desfazem mais, sobretudo quando as religiões são distantes.
      ficha: lehrer-1993-religiao-estabilidade

  - id: idade
    nome: Idade parecida
    atracao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    satisfacao:
      degrau: 0
      texto_simples: Nenhum estudo lido mede isso.
    duracao:
      degrau: 0
      medida: "HR 1,022 por ano (estudo fraco)"
      texto_simples: 'Só um estudo fraco e ambíguo. "10 anos de diferença = 39% mais divórcio" não está no artigo que costuma ser citado.'
      ficha: francis-tan-2015-gastos-casamento-divorcio

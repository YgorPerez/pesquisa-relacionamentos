<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTÓTIPO · Navegação, Perfil e calculadoras</title>
<!--
  PROTÓTIPO DESCARTÁVEL (ticket #16, "Navegação entre Guias, seletor de Perfil e calculadoras").
  Um site de mentira (Início, dois Temas, nove Guias, as duas calculadoras) para julgar três formas de:
    - onde o usuário escolhe o Perfil e como ele vale em todo o site;
    - como Grupo possível (B5) e Prioridades (B1) aparecem dentro e fora do Guia;
    - como se vai de um Guia a uma Pergunta relacionada no celular e se volta ao ponto exato.
  A: Perfil num chip fixo no topo; calculadora inteira dentro do Guia.
  B: Perfil pedido onde ele muda algo; o Guia mostra uma prévia da calculadora.
  C: abas embaixo no celular (Guias, Grupo possível, Prioridades, Você); Pergunta relacionada abre numa folha.
  Variante em ?v=, página no #/caminho. Troque pela barra escura ou com ← →.
  O "voltar ao ponto exato" é real: rolagem e seções abertas ficam no history.state da entrada.
  Estado só em memória (o site guardaria no localStorage, ADR 0001). Textos e números são de exemplo:
  as Fichas contam como ⬜ (#6), e a conta do Grupo possível é inventada. Servem para julgar a navegação.
  A identidade visual é de outro ticket ("Identidade visual e página do Guia"); aqui o visual é neutro.
-->
<style>
  :root {
    --tx:#1c2321; --mu:#5b6663; --bd:#dfe4e2; --bg:#f7f8f7; --card:#fff;
    --acc:#0e6b62; --acc-soft:#e3f1ef; --acc-ink:#0a4f48;
    --warn:#9a4a07; --warn-soft:#fff4e5; --ok:#0e6b62;
    --n3:#0e6b62; --n2:#4f9e94; --n1:#cfe6e2; --n0:#eceeed;
    --r:12px; --tab:64px;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--tx); background:var(--bg); }
  ::selection { background:#bfe3dd; }
  a { color:var(--acc); text-underline-offset:3px; }
  :focus-visible { outline:3px solid #f0a020; outline-offset:2px; border-radius:6px; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  h1 { font-size:1.6rem; line-height:1.2; margin:.2rem 0 .8rem; text-wrap:balance; letter-spacing:-.01em; }
  h2 { font-size:1.15rem; margin:2rem 0 .6rem; }
  h3 { font-size:1rem; margin:1.2rem 0 .4rem; }
  p { margin:.5rem 0; }
  .wrap { max-width:720px; margin:0 auto; padding:0 18px; }
  .muted { color:var(--mu); }
  .small { font-size:.875rem; }
  .tiny { font-size:.8rem; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sp { flex:1; }
  main { padding:12px 0 140px; }
  body.v-C main { padding-bottom:calc(var(--tab) + 120px); }

  .prot { background:#fff7d6; color:#6b4b00; font-size:.8rem; padding:6px 18px; text-align:center; }

  /* cabeçalho */
  .top { background:var(--card); border-bottom:1px solid var(--bd); }
  .top .wrap { display:flex; align-items:center; gap:12px; min-height:56px; }
  .marca { font-weight:700; text-decoration:none; color:var(--tx); white-space:nowrap; }
  .marca small { font-weight:400; color:var(--mu); }
  .nav { display:flex; gap:4px; }
  .nav a { text-decoration:none; color:var(--tx); padding:8px 10px; border-radius:8px; font-size:.95rem; }
  .nav a.on { background:var(--acc-soft); color:var(--acc-ink); font-weight:600; }
  body.v-A .top { position:sticky; top:0; z-index:5; }

  .chip-perfil { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--bd); background:var(--card); border-radius:99px; padding:6px 12px 6px 8px; min-height:40px; font-size:.9rem; max-width:100%; }
  .chip-perfil .bola { width:26px; height:26px; border-radius:50%; background:var(--acc-soft); display:grid; place-items:center; flex:none; }
  .chip-perfil.vazio { border-style:dashed; color:var(--mu); }
  .chip-perfil[aria-expanded="true"] { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc-soft); }
  .chip-perfil span.t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  svg.ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  .painel-perfil { background:var(--card); border-bottom:1px solid var(--bd); box-shadow:0 8px 20px -12px rgba(0,0,0,.25); }
  .painel-perfil .wrap { padding-top:14px; padding-bottom:16px; }

  /* formulário do Perfil */
  .pf { display:grid; gap:14px; }
  .pf fieldset { border:0; margin:0; padding:0; }
  .pf legend { font-weight:600; font-size:.95rem; margin-bottom:6px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg label { position:relative; }
  .seg input { position:absolute; opacity:0; inset:0; margin:0; }
  .seg span { display:inline-flex; align-items:center; min-height:44px; padding:0 16px; border:1px solid var(--bd); border-radius:10px; background:var(--card); }
  .seg input:checked + span { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  .seg input:focus-visible + span { outline:3px solid #f0a020; outline-offset:2px; }
  .idade { display:flex; align-items:center; gap:8px; }
  .idade input { width:88px; min-height:44px; padding:0 10px; border:1px solid var(--bd); border-radius:10px; font-size:1rem; }
  .pf .acoes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:44px; padding:0 16px; border-radius:10px; border:1px solid var(--bd); background:var(--card); text-decoration:none; color:var(--tx); font-weight:500; }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn.link { border:0; background:none; color:var(--acc); padding:0 4px; min-height:36px; text-decoration:underline; text-underline-offset:3px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  /* Guia */
  .migalha { font-size:.875rem; margin-top:14px; }
  .migalha a { color:var(--mu); }
  .voltar { display:flex; align-items:center; gap:6px; margin:12px 0 0; padding:10px 12px; background:var(--card); border:1px solid var(--bd); border-radius:10px; width:100%; text-align:left; font-size:.92rem; min-height:44px; }
  .voltar b { font-weight:600; }
  .curta { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:16px 18px; }
  .curta p { font-size:1.08rem; margin:0 0 10px; }
  .conf { display:inline-flex; gap:6px; align-items:center; font-size:.85rem; background:var(--acc-soft); color:var(--acc-ink); border-radius:99px; padding:3px 10px; font-weight:600; }
  .aviso { background:var(--warn-soft); color:#5d3204; border:1px solid #f4d2a6; border-radius:10px; padding:10px 14px; font-size:.92rem; margin:12px 0; }
  .aviso.leve { background:var(--card); border-color:var(--bd); color:var(--mu); }
  .vale { display:inline-block; font-size:.8rem; font-weight:700; color:#fff; background:var(--ok); border-radius:6px; padding:1px 8px; margin-right:6px; }
  .naovale { display:block; font-size:.85rem; color:var(--warn); margin-top:4px; }
  .amostra { display:block; font-size:.85rem; color:var(--mu); margin-top:4px; }
  .lista { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  .achado { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:12px 14px; }
  .achado.seu { border-color:var(--acc); background:#f3faf8; }
  .ficha { font-size:.85rem; color:var(--acc); }
  details.sec { border-top:1px solid var(--bd); }
  details.sec > summary { cursor:pointer; padding:14px 0; font-weight:600; list-style:none; display:flex; justify-content:space-between; align-items:center; min-height:48px; }
  details.sec > summary::after { content:"+"; font-size:1.3rem; color:var(--mu); }
  details.sec[open] > summary::after { content:"–"; }
  details.sec > div { padding-bottom:14px; }
  .rel { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .rel a, .rel button.relb { display:flex; gap:10px; align-items:center; justify-content:space-between; text-align:left; width:100%; padding:14px 16px; background:var(--card); border:1px solid var(--bd); border-radius:10px; text-decoration:none; color:var(--tx); min-height:56px; font-size:1rem; }
  .rel small { display:block; color:var(--mu); font-size:.85rem; margin-top:2px; }
  .rel.grande a { padding:18px; }

  /* cartão de calculadora (prévia e atalho) */
  .calc-card { display:block; text-decoration:none; color:var(--tx); background:var(--card); border:1px solid var(--acc); border-radius:var(--r); padding:16px 18px; margin:16px 0; }
  .calc-card .t { font-weight:700; color:var(--acc-ink); }
  .calc-card .num { font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; margin:4px 0; }
  .calc-card .ir { color:var(--acc); font-weight:600; margin-top:8px; display:flex; align-items:center; gap:6px; }

  /* calculadora: moldura */
  .calc { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:16px 16px 18px; margin:16px 0; }
  .calc h2 { margin-top:0; }
  .calc .cab { display:flex; gap:8px; align-items:baseline; justify-content:space-between; flex-wrap:wrap; }
  .origem { font-size:.85rem; color:var(--mu); background:var(--bg); border-radius:8px; padding:8px 10px; margin:8px 0 12px; }

  /* Grupo possível */
  .gp-res { background:var(--acc-soft); border-radius:10px; padding:14px; margin:12px 0; }
  .gp-res .faixa { font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.2; color:var(--acc-ink); }
  .gp-ctl { display:grid; gap:14px; }
  .gp-ctl label.l { display:block; font-weight:600; font-size:.92rem; margin-bottom:4px; }
  .gp-ctl input[type=range] { width:100%; accent-color:var(--acc); min-height:32px; }
  .gp-ctl select { min-height:44px; padding:0 10px; border:1px solid var(--bd); border-radius:10px; background:var(--card); }
  .chk { display:flex; gap:10px; align-items:center; min-height:44px; }
  .chk input { width:22px; height:22px; accent-color:var(--acc); }
  .des { opacity:.55; }
  .pesa { list-style:none; padding:0; margin:6px 0 0; display:grid; gap:6px; }
  .pesa li { display:flex; justify-content:space-between; gap:8px; font-size:.92rem; border-bottom:1px solid var(--bd); padding:6px 0; }
  .pesa b { font-variant-numeric:tabular-nums; }

  /* Prioridades */
  .seg3 { display:grid; grid-template-columns:repeat(3,1fr); background:#e8ecea; border-radius:10px; padding:3px; margin:6px 0 12px; }
  .seg3 button { border:0; background:transparent; min-height:42px; border-radius:8px; font-weight:600; color:var(--mu); }
  .seg3 button.on { background:var(--card); color:var(--tx); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .pr-lista { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  .pr-it { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:4px 4px 4px 12px; min-height:56px; }
  .pr-it.alerta { border-color:#e08a1e; box-shadow:0 0 0 1px #e08a1e; }
  .pr-it .pos { width:20px; color:var(--mu); font-weight:700; font-variant-numeric:tabular-nums; }
  .pr-it .nm { flex:1; line-height:1.25; }
  .pr-it .mv { width:44px; height:44px; border:1px solid var(--bd); border-radius:8px; background:var(--card); display:grid; place-items:center; }
  .nivel { font-size:.8rem; font-weight:600; border-radius:99px; padding:2px 9px; white-space:nowrap; }
  .nivel.n3 { background:var(--n3); color:#fff; } .nivel.n2 { background:var(--n2); color:#fff; }
  .nivel.n1 { background:var(--n1); color:#134e48; } .nivel.n0 { background:var(--n0); color:var(--mu); }
  .joel { background:var(--acc-soft); border-radius:10px; padding:10px 12px; font-size:.92rem; margin-bottom:10px; }
  .joel .barra { display:flex; height:10px; border-radius:99px; overflow:hidden; margin-top:8px; background:#fff; }

  /* Início e Tema */
  .temas { display:grid; gap:24px; }
  .perg { list-style:none; margin:0; padding:0; border-top:1px solid var(--bd); }
  .perg li { border-bottom:1px solid var(--bd); }
  .perg a { display:block; padding:14px 2px; text-decoration:none; color:var(--tx); }
  .perg a b { display:block; font-size:1.02rem; }
  .perg a span { display:block; font-size:.9rem; color:var(--mu); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .atalhos { display:grid; gap:10px; grid-template-columns:1fr 1fr; margin:16px 0 8px; }
  .atalhos a { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); padding:14px; text-decoration:none; color:var(--tx); }
  .atalhos a b { display:block; }
  .atalhos a span { font-size:.85rem; color:var(--mu); }

  /* C: abas e folha */
  .tabs { display:none; }
  body.v-C .tabs { display:grid; grid-template-columns:repeat(4,1fr); position:fixed; left:0; right:0; bottom:0; height:calc(var(--tab) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:var(--card); border-top:1px solid var(--bd); z-index:20; }
  .tabs a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-decoration:none; color:var(--mu); font-size:.72rem; font-weight:600; position:relative; }
  .tabs a.on { color:var(--acc); }
  .tabs a.on::before { content:""; position:absolute; top:0; left:25%; right:25%; height:3px; border-radius:0 0 3px 3px; background:var(--acc); }
  .tabs svg.ic { width:22px; height:22px; }
  .tabs .ponto { position:absolute; top:10px; right:calc(50% - 18px); width:8px; height:8px; border-radius:50%; background:#e08a1e; }

  .veu { position:fixed; inset:0; background:rgba(20,28,26,.38); z-index:30; opacity:0; transition:opacity .2s; }
  .veu.on { opacity:1; }
  .folha { position:fixed; left:0; right:0; bottom:0; max-height:90vh; height:90vh; background:var(--bg); border-radius:16px 16px 0 0; z-index:31; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 30px rgba(0,0,0,.18); }
  .folha.on { transform:none; }
  .folha .alca { width:40px; height:5px; border-radius:99px; background:#c9d0cd; margin:8px auto 4px; }
  .folha .fc { display:flex; gap:8px; align-items:center; padding:4px 12px 8px; border-bottom:1px solid var(--bd); }
  .folha .corpo { overflow:auto; padding:0 18px 40px; flex:1; overscroll-behavior:contain; }
  .folha .corpo h1 { font-size:1.35rem; margin-top:14px; }
  @media (prefers-reduced-motion:reduce) { .folha, .veu { transition:none; } }

  /* estado do protótipo */
  .estado { margin-top:40px; font-size:.8rem; color:var(--mu); background:#eef1f0; border-radius:10px; padding:10px 12px; }
  .estado summary { cursor:pointer; font-weight:600; }
  .estado pre { white-space:pre-wrap; word-break:break-word; margin:8px 0 0; font-size:.78rem; }
  .toast { position:fixed; left:50%; top:16px; transform:translate(-50%,-150%); background:#1c2321; color:#fff; padding:10px 16px; border-radius:99px; font-size:.9rem; z-index:60; transition:transform .25s; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .toast.on { transform:translate(-50%,0); }

  /* barra de troca de variante: não faz parte do design */
  #switcher { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); background:#101828; color:#fff; border-radius:99px; padding:5px 6px; display:flex; gap:4px; align-items:center; box-shadow:0 6px 24px rgba(0,0,0,.3); z-index:50; font-size:.85rem; max-width:calc(100% - 20px); }
  #switcher button { background:transparent; color:#fff; border:0; font-size:1.2rem; min-width:40px; min-height:38px; border-radius:99px; }
  #switcher span { text-align:center; padding:0 4px; }
  body.v-C #switcher { bottom:calc(var(--tab) + 10px + env(safe-area-inset-bottom)); }

  @media (min-width:760px) {
    h1 { font-size:2rem; }
    .wrap { padding:0 28px; }
    body.v-C .tabs { position:static; height:auto; display:flex; gap:4px; border:0; background:none; padding:0; }
    body.v-C .tabs a { flex-direction:row; font-size:.92rem; padding:8px 12px; border-radius:8px; gap:6px; }
    body.v-C .tabs a.on { background:var(--acc-soft); color:var(--acc-ink); }
    body.v-C .tabs a.on::before { display:none; }
    body.v-C .tabs .ponto { position:static; }
    body.v-C main { padding-bottom:140px; }
    body.v-C #switcher { bottom:18px; }
    .folha { left:auto; right:0; top:0; bottom:0; width:min(560px, 92vw); height:auto; max-height:none; border-radius:16px 0 0 16px; transform:translateX(100%); }
    .folha .alca { display:none; }
    .temas { grid-template-columns:1fr 1fr; gap:32px; }
    .wrap.largo { max-width:1040px; }
  }
  @media (min-width:760px) { #tabs { display:none !important; } }
  @media (max-width:759px) {
    .top .nav.desk { display:none; }
    body.v-C .top .tabs-desk { display:none; }
    body.v-A .top .wrap { flex-wrap:nowrap; }
    body.v-A .marca small { display:none; }
    .chip-perfil { max-width:62vw; }
  }
</style>
</head>
<body>
<div class="prot">Protótipo descartável · textos e números de exemplo · as Fichas ainda contam como ⬜</div>
<div id="topo"></div>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div id="folha-raiz"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="switcher"><button id="prev" aria-label="Variante anterior">‹</button><span id="vlabel"></span><button id="next" aria-label="Próxima variante">›</button></div>

<script>
// =====================================================================
// CONTEÚDO DE EXEMPLO (no site, viria de guias/<tema>/<slug>.md, #10)
// =====================================================================
const TEMAS = [
  { slug:'onde-conhecer-pessoas', titulo:'Onde conhecer pessoas',
    contexto:'Onde os casais se conhecem, se o lugar muda alguma coisa e onde vale a pena tentar. Quase todos os dados são de fora do Brasil, e cada Guia diz isso.',
    guias:['onde-os-casais-se-conhecem','o-lugar-muda-a-relacao','app-ou-presencial','com-que-idade-se-casa'] },
  { slug:'escolher-parceiro', titulo:'Escolher parceiro',
    contexto:'O que se sabe sobre o que prevê atração, satisfação e duração, e quanto os seus Requisitos estreitam o grupo de pessoas possíveis.',
    guias:['que-caracteristicas-preveem','precisamos-ser-parecidos','o-que-digo-querer','aparencia-e-dinheiro','meus-requisitos-sao-exigentes'] },
];
// cobre: o que a amostra cobriu (#5). Dimensão ausente = o estudo não separou por ela.
// casal: proposta deste protótipo; as listas do #5 sozinhas deixam "homem que procura homens" casar com estudo de casais héteros.
const HETERO = { generos:['homem','mulher'], procura:['homens','mulheres'], casal:'hetero' };
const G = {
  'onde-os-casais-se-conhecem': { tema:'onde-conhecer-pessoas', pergunta:'Onde os casais se conhecem hoje?', conf:'moderada',
    curta:'Nos EUA, a internet virou o lugar mais comum: perto de 4 em cada 10 casais de 2017 se conheceram online. Fora dos EUA a fatia é bem menor, abaixo de 9% na França e perto de 11% no Reino Unido. No Brasil não há pesquisa representativa.',
    achados:[
      { t:'Nos EUA, cerca de 39% dos casais héteros formados em 2017 se conheceram pela internet.', f:'rosenfeld-2019', am:'EUA, 2017, casais héteros', cobre:{...HETERO, idades:{min:18,max:80}} },
      { t:'Entre casais do mesmo sexo nos EUA, conhecer-se online é ainda mais comum: a maioria.', f:'rosenfeld-2019', am:'EUA, 2017, casais do mesmo sexo', cobre:{ generos:['homem','mulher'], procura:['homens','mulheres'], casal:'mesmo-sexo' } },
      { t:'Na França, menos de 9% dos casais formados até 2013 se conheceram em sites ou apps.', f:'bergstrom-2016', am:'França, 2013', cobre:{...HETERO, idades:{min:26,max:65}} },
      { t:'No Reino Unido, perto de 11% dos casais recentes se conheceram online.', f:'lampard-2020', am:'Reino Unido, 2010–2012', cobre:{...HETERO, idades:{min:16,max:74}} },
    ],
    varia:'Os dados americanos separam casais héteros e do mesmo sexo. Os europeus não separam idade dentro do casal. Nenhum separa quem tem outra identidade de gênero.',
    mitos:['"Mais da metade dos casais já se conhece por app": o número vem de 117 e 74 casais da pesquisa americana depois de 2020 e não foi publicado.'],
    limites:'Não existe pesquisa representativa no Brasil. O estudo brasileiro mais próximo (Kowal 2025) tem 119 pessoas e não mede onde o país todo se conhece.',
    fichas:['rosenfeld-2019','bergstrom-2016','lampard-2020','kowal-2025'],

function perfilVazio(p) { return !p.g && !p.p && p.idade == null; }
function valePara(p, cobre) {
  if (perfilVazio(p)) return null;               // sem Perfil: só a nota da amostra
  if (p.g === 'outro') return cobre.generos ? false : true;
  if (p.g && cobre.generos && !cobre.generos.includes(p.g)) return false;
  if (p.p && cobre.procura) {
    const quer = p.p === 'ambos' ? ['homens','mulheres'] : [p.p];
    if (!quer.some(q => cobre.procura.includes(q))) return false;
  }
  if (cobre.casal && (p.g === 'homem' || p.g === 'mulher') && p.p && p.p !== 'ambos') {
    const mesmo = (p.g === 'homem') === (p.p === 'homens');
    if ((cobre.casal === 'hetero') === mesmo) return false;
  }
  if (p.idade != null && cobre.idades && (p.idade < cobre.idades.min || p.idade > cobre.idades.max)) return false;
  return true;
}
function perfilTexto(p) {
  if (perfilVazio(p)) return 'Perfil: não informado';
  const g = { homem:'homem', mulher:'mulher', outro:'outro gênero' }[p.g] || '';
  const q = p.p ? `procura ${p.p}` : '';
  return [g, q, p.idade != null ? `${p.idade} anos` : ''].filter(Boolean).join(' · ');
}

const UF = { BR:['Brasil', 81e6], SP:['São Paulo', 17.6e6], RJ:['Rio de Janeiro', 6.6e6], MG:['Minas Gerais', 8.2e6], BA:['Bahia', 5.4e6], PE:['Pernambuco', 3.5e6] };
const ESC = ['qualquer','ensino médio completo','superior completo'];
function procuraEfetiva(p, gp) { return gp.procura || p.p || 'mulheres'; }
function fatores(p, gp) {
  const procura = procuraEfetiva(p, gp);
  const f = [];
  const anos = gp.imax - gp.imin + 1;
  f.push({ id:'idade', nome:`Idade ${gp.imin}–${gp.imax}`, v: Math.min(1, anos / 63 * 1.25) });
  if (gp.disp) f.push({ id:'disp', nome:'Não mora com companheiro(a)', v:0.46 });
  if (gp.esc) f.push({ id:'esc', nome:`Escolaridade: ${ESC[gp.esc]}`, v:[1, 0.55, 0.21][gp.esc] });
  if (gp.fuma) f.push({ id:'fuma', nome:'Não fuma', v:0.87, pns:true });
  if (gp.alt > 0) {
    const [m, s] = procura === 'homens' ? [171, 7] : procura === 'mulheres' ? [159, 6.5] : [165, 9];
    const z = (gp.alt - m) / s, cdf = 1 / (1 + Math.exp(-1.702 * z));
    f.push({ id:'alt', nome:`Altura de ${gp.alt} cm ou mais`, v:Math.max(0.005, 1 - cdf), pns:true });
  }
  if (gp.filhos && procura === 'mulheres') f.push({ id:'filhos', nome:'Sem filhos', v:0.52 });
  if (gp.filhos && procura === 'ambos') f.push({ id:'filhos', nome:'Sem filhos (só mulheres)', v:0.76 });
  if (p.g && p.g !== 'outro' && p.p) {
    const igual = (p.g === 'homem' && procura === 'homens') || (p.g === 'mulher' && procura === 'mulheres');
    const v = procura === 'ambos' ? 0.5 : igual ? 0.03 : 0.95;
    f.push({ id:'orient', nome:'Orientação compatível (do Perfil)', v, pns:true, fixo:true });
  }
  return f;
}
function estimar(p, gp) {
  const procura = procuraEfetiva(p, gp);
  const base = UF[gp.uf][1] * (procura === 'ambos' ? 2 : 1);
  const fs = fatores(p, gp);
  const c = fs.reduce((a, x) => a * x.v, base);
  const largura = 0.06 + 0.05 * fs.filter(x => x.pns).length;
  const pesa = fs.filter(x => !x.fixo).map(x => ({ nome:x.nome, vezes:1 / x.v })).sort((a, b) => b.vezes - a.vezes);
  return { c, lo:c * (1 - largura), hi:c * (1 + largura), pesa, procura, instavel: c < 2000, teto: p.g === 'outro' || !p.g };
}
function arred(n) {
  if (n < 1) return '0';
  const d = Math.pow(10, Math.max(0, Math.floor(Math.log10(n)) - 1));
  const r = Math.round(n / d) * d;
  if (r >= 1e6) return (r / 1e6).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' milhões';
  if (r >= 1e3) return (r / 1e3).toLocaleString('pt-BR', { maximumFractionDigits:0 }) + ' mil';
  return r.toLocaleString('pt-BR');
}

        ${doPerfil ? '<span class="tiny muted"> do seu Perfil</span>' : ''}</div>
      <div><label class="l" for="gp-uf">Onde</label><select id="gp-uf" data-gp="uf" data-foco="gp-uf">${Object.entries(UF).map(([k, [n]]) => `<option value="${k}" ${gp.uf === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>

      <div><label class="l" for="gp-alt">Altura mínima: <span id="gp-al">${gp.alt ? gp.alt + ' cm' : 'qualquer'}</span></label>

      <label class="chk"><input type="checkbox" data-gp="fuma" data-foco="gp-fuma" ${gp.fuma ? 'checked' : ''}> Não fuma</label>
      <label class="chk ${filhosDes ? 'des' : ''}"><input type="checkbox" data-gp="filhos" data-foco="gp-filhos" ${gp.filhos && !filhosDes ? 'checked' : ''} ${filhosDes ? 'disabled' : ''}> Sem filhos
        ${filhosDes ? '<span class="tiny">· o Censo não pergunta filhos aos homens</span>' : e.procura === 'ambos' ? '<span class="tiny muted">· vale só para as mulheres</span>' : ''}</label>

function resGrupo(e) {

function calcPrio(onde) {

function corpoGuia(slug, emFolha = false) {
  const g = G[slug], t = temaDe(slug), v = st.v;

  let calc = '';
  if (g.calc && !emFolha) calc = v === 'A' ? (g.calc === 'grupo' ? calcGrupo('guia') : calcPrio('guia')) : v === 'B' ? previaCalc(g) : atalhoAba(g);
  if (g.calc && emFolha) calc = atalhoAba(g);
  const pedirPerfilB = v === 'B' && perfilVazio(st.perfil)
    ? `<p class="small" style="margin:10px 2px 0"><a href="#" data-acao="ir-perfil">Diga seu Perfil e veja o que vale para você</a> <span class="muted">· opcional</span></p>` : '';
  let perfilSec = `<p>${esc(g.varia)}</p>`;
  if (v === 'B') {
    perfilSec += perfilVazio(st.perfil) || st.formB
      ? `<div class="curta" style="margin-top:10px">${formPerfil('b-' + slug, `<button class="btn pri" data-acao="fechar-formB">Pronto</button>`)}</div>`
      : `<div class="row small" style="margin-top:8px"><span>Seu Perfil: <b>${esc(perfilTexto(st.perfil))}</b></span><button class="btn link" data-acao="abrir-formB">mudar</button></div>`;
  }
  if (v === 'C' && !emFolha) perfilSec += `<p class="small">${perfilVazio(st.perfil) ? 'Para marcar o que vale para você, preencha a aba <a href="#/voce">Você</a>.' : `Seu Perfil: <b>${esc(perfilTexto(st.perfil))}</b> · <a href="#/voce">mudar na aba Você</a>`}</p>`;

    ${secao(k + 'sec-lim', 'Limitações e o que não se sabe', `<p>${esc(g.limites)}</p>`)}
    ${secao(k + 'sec-fichas', `Fichas citadas (${g.fichas.length})`, `<ul class="lista">${g.fichas.map(f => `<li>${selo(f)} <span class="tiny muted">· Força moderada</span></li>`).join('')}</ul>`)}

    <h2>Perguntas relacionadas</h2>${relHtml(g, emFolha ? 'C' : v)}`;

  const v = st.v, p = st.perfil;

  if (v === 'A') return `<header class="top"><div class="wrap"><a class="marca" href="#/">[nome do site] <small>evidência sobre relacionamentos</small></a>${nav}<span class="sp"></span>

function abas(pg, desk) {
  const ultimo = st.ultimoGuia ? `#${caminhoGuia(st.ultimoGuia)}` : '#/';
  const on = t => ({ guias:['inicio','tema','guia'], grupo:['grupo'], prio:['prioridades'], voce:['voce'] }[t].includes(pg.tipo) ? 'on' : '');
  const h = `<a href="${on('guias') && pg.tipo === 'guia' ? '#/' : ultimo}" class="${on('guias')}">${IC.livro}<span>Guias</span></a>
    <a href="#/grupo-possivel" class="${on('grupo')}">${IC.grupo}<span>Grupo possível</span></a>
    <a href="#/prioridades" class="${on('prio')}">${IC.ordem}<span>Prioridades</span></a>
    <a href="#/voce" class="${on('voce')}">${IC.pessoa}<span>Você</span>${perfilVazio(st.perfil) ? '<span class="ponto" aria-label="Perfil não informado"></span>' : ''}</a>`;
  return desk ? `<nav class="tabs" style="display:flex">${h}</nav>` : h;
}

// ---------- folha (C) ----------
function folha(slug, rolagem) {
  const raiz = document.getElementById('folha-raiz');
  if (st.v !== 'C' || !slug || !G[slug]) {
    const f = raiz.querySelector('.folha');
    if (f) { f.classList.remove('on'); raiz.querySelector('.veu').classList.remove('on'); setTimeout(() => { if (!rota().folha) raiz.innerHTML = ''; }, 280); }
    document.body.style.overflow = '';
    return;
  }
  const ja = raiz.querySelector('.folha');
  const html = `<div class="corpo" tabindex="-1">${corpoGuia(slug, true)}</div>`;
  if (ja) { ja.querySelector('.corpo').outerHTML = html; }
  else raiz.innerHTML = `<div class="veu" data-acao="fechar-folha"></div>
    <div class="folha" role="dialog" aria-modal="true" aria-label="Pergunta relacionada"><div class="alca"></div>
      <div class="fc"><button class="btn" data-acao="fechar-folha" aria-label="Fechar">${IC.x}</button><span class="sp small muted">Pergunta relacionada</span>
        <a class="btn" id="folha-pagina" href="#">${IC.abrir} Página inteira</a></div>${html}</div>`;
  raiz.querySelector('#folha-pagina').href = `#${caminhoGuia(slug)}`;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    raiz.querySelector('.folha').classList.add('on'); raiz.querySelector('.veu').classList.add('on');
    const c = raiz.querySelector('.corpo'); c.scrollTop = rolagem || 0; c.focus({ preventScroll:true });
  });
}

function desenhar() {
  document.body.className = 'v-' + st.v;
  const r = rota(), pg = pagina(r.path);
  document.getElementById('topo').innerHTML = topo(pg);
  document.getElementById('tabs').innerHTML = st.v === 'C' ? abas(pg, false) : '';
  const corpo = { inicio:pgInicio, tema:() => pgTema(pg.tema), guia:() => pgGuia(pg.slug), grupo:() => pgCalc('grupo'), prioridades:() => pgCalc('prio'),
    voce:() => st.v === 'C' ? pgVoce() : '<div class="wrap"><h1>Só na variante C</h1></div>', '404':() => '<div class="wrap"><h1>Página não encontrada</h1></div>' }[pg.tipo]();
  document.getElementById('app').innerHTML = corpo + `<div class="wrap"><details class="estado"><summary>Estado do protótipo</summary><pre id="estado"></pre></details></div>`;
  document.getElementById('vlabel').textContent = `${st.v} · ${VARIANTES.find(v => v[0] === st.v)[1]}`;
  ultimaBase = r.path + '|' + st.v;
}
function mostrarEstado() {
  const el = document.getElementById('estado'); if (!el) return;
  el.textContent = JSON.stringify({
    variante: st.v, rota: location.hash || '#/', perfil: st.perfil,
    grupo: st.gp, prioridades: { topo3: st.pr.ordem.slice(0, 3), desfecho: st.pr.desf },
    'entrada do histórico': history.state, 'restaurado ao chegar': st.restaurado, 'entradas na aba': history.length,
  }, null, 1);
}
let tt;
function aviso(txt) { const t = document.getElementById('toast'); t.textContent = txt; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-acao],[data-desf],[data-mover]');
  if (!t) return;
  const a = t.dataset.acao;
  if (a) e.preventDefault();
  if (a === 'painel') { st.painelPerfil = !st.painelPerfil; redesenhar(); if (st.painelPerfil) document.querySelector('#painel-perfil input')?.focus(); return; }
  if (a === 'apagar-perfil') { st.perfil = { g:'', p:'', idade:null }; st.gp.procura = null; st.gp.imin = null; redesenhar(); return; }
  if (a === 'abrir-formB') { st.formB = true; redesenhar(); return; }
  if (a === 'fechar-formB') { st.formB = false; redesenhar(); return; }
  if (a === 'ir-perfil') { document.getElementById('varia').scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  if (a === 'voltar' || a === 'fechar-folha') { history.back(); return; }
  if (a === 'ficha') { aviso('Página da Ficha: fora deste protótipo'); return; }
  if (a === 'compartilhar') { aviso('Link copiado (de mentira): leva o estado na query'); return; }
  if (t.dataset.desf) { st.pr.desf = t.dataset.desf; atualizarCalc(); return; }
  if (t.dataset.mover) {
    const [id, d] = t.dataset.mover.split(':'), o = st.pr.ordem, i = o.indexOf(id), j = i + +d;
    [o[i], o[j]] = [o[j], o[i]]; st.pr.mexeu = true; atualizarCalc();
  }
});
// Calculadora: refaz só ela, com o foco no mesmo controle.
function atualizarCalc() {
  const foco = document.activeElement && document.activeElement.dataset.foco;
  const dentroFolha = !!document.activeElement?.closest('.folha');
  if (dentroFolha) { redesenhar(); return; }
  const gp = document.getElementById('calc-grupo'), pr = document.getElementById('calc-prio');
  const onde = rota().path.startsWith('/grupo-possivel') || rota().path.startsWith('/prioridades') ? 'pagina' : 'guia';
  if (gp) gp.outerHTML = calcGrupo(onde);
  if (pr) pr.outerHTML = calcPrio(onde);
  if (foco) { const el = document.querySelector(`[data-foco="${foco}"]`); if (el) el.focus(); }
  mostrarEstado();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.gp && t.type === 'range') {
    const k = t.dataset.gp; st.gp[k] = +t.value;
    if (k === 'imin' && st.gp.imin > st.gp.imax) st.gp.imax = st.gp.imin;
    if (k === 'imax' && st.gp.imax < st.gp.imin) st.gp.imin = st.gp.imax;
    if (k === 'alt' && st.gp.alt > 0 && st.gp.alt < 140) st.gp.alt = 140;
    // enquanto arrasta, só o resultado muda (#8: recalcula durante o movimento)
    document.getElementById('gp-res').innerHTML = resGrupo(estimar(st.perfil, st.gp));
    document.getElementById('gp-il').textContent = `${st.gp.imin} a ${st.gp.imax}`;
    document.getElementById('gp-al').textContent = st.gp.alt ? st.gp.alt + ' cm' : 'qualquer';
    mostrarEstado();
  }
  if (t.dataset.pf === 'idade') {
    const n = parseInt(t.value, 10);
    st.perfil.idade = n >= 18 && n <= 99 ? n : null;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf === 'g' || t.dataset.pf === 'p') {
    st.perfil[t.dataset.pf] = t.value;
    if (t.dataset.pf === 'p') st.gp.procura = null;   // o Perfil volta a ser o ponto de partida
    redesenhar(); return;
  }
  if (t.dataset.pf === 'idade') { st.gp.imin = null; redesenhar(); return; }
  if (t.dataset.gp && t.type !== 'range') {
    const k = t.dataset.gp;
    st.gp[k] = t.type === 'checkbox' ? t.checked : k === 'esc' ? +t.value : t.value;
    atualizarCalc(); return;
  }
  if (t.dataset.gp) atualizarCalc();
});

// variante
function trocar(d) {
  const i = VARIANTES.findIndex(v => v[0] === st.v);
  st.v = VARIANTES[(i + d + VARIANTES.length) % VARIANTES.length][0];
  st.painelPerfil = false; st.formB = false;
  const r = rota();
  history.replaceState(history.state, '', `?v=${st.v}#${r.path}`);   // a folha só existe em C
  redesenhar(); folha(null);
}
document.getElementById('prev').onclick = () => trocar(-1);
document.getElementById('next').onclick = () => trocar(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') trocar(-1);
  if (e.key === 'ArrowRight') trocar(1);
  if (e.key === 'Escape' && rota().folha) history.back();
});
if (!location.hash) history.replaceState(null, '', `?v=${st.v}#/`);
navegar();
</script>
</body>
</html>

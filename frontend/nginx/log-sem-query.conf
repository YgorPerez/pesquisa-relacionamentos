# O formato do access_log de todos os vhosts do site (ADR 0001). O deploy
# instala este arquivo em `/etc/nginx/conf.d/temestudo-log-sem-query.conf`,
# que o `nginx.conf` do Ubuntu inclui dentro do `http`, antes dos
# `sites-enabled/`.
#
# O caminho é o pedido cortado antes do primeiro `?`. Ficam de fora
# `$request`, `$request_uri`, `$args` e o `$http_referer`, que levam a query
# do link ou o endereço de onde o visitante veio.
map $request_uri $temestudo_caminho {
  default "-";
  "~^(?<temestudo_sem_query>[^?]*)" $temestudo_sem_query;
}

log_format temestudo_sem_query '$remote_addr [$time_local] "$request_method $temestudo_caminho $server_protocol" $status $body_bytes_sent $request_time "$host"';

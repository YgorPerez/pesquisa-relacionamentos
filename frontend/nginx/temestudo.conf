# The Nginx of the Tem estudo? VPS host, which serves only this site. The
# deploy (`../scripts/vps.ts`) installs this file at
# `/etc/nginx/sites-available/temestudo.conf`, with the link in
# `sites-enabled/`, and only keeps it live if `nginx -t` passes. The app runs
# in a container on 127.0.0.1, on a port of the pair the deploy swaps
# (blue/green), and the current port comes from the include
# `/etc/nginx/temestudo/temestudo-app.conf`.
#
# The share link carries the Profile in the query (ADR 0001), so no log keeps
# the query: the access_log uses the `temestudo_sem_query` format
# (`log-without-query.conf`), with the path cut before the `?`, and without
# the Referer. The error_log copies the request line when something fails. It
# lives in `/var/log/nginx/temestudo/` and rotates daily, keeping 3 days
# (`logrotate-temestudo`). The subfolder takes both files out of the `*.log`
# of Ubuntu's `/etc/logrotate.d/nginx`, which keeps 14 days. `nginx.test.ts`
# checks all of this by what is written here.
#
# GoatCounter (#35) goes in another file, `temestudo-stats.conf`, with
# `server_name stats.temestudo.cloud` and the same access_log. The format
# lives in `conf.d/`, which Ubuntu's `nginx.conf` reads before
# `sites-enabled/`, so it applies to any vhost, in whatever order.

# A request by IP or by a host that is not the site falls here, with no
# response, and its log does not carry the query either. On 443, with no
# certificate: the handshake is refused.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;
  ssl_reject_handshake on;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  return 444;
}

# Certbot's challenge (webroot) and the rest to https.
server {
  listen 80;
  listen [::]:80;
  server_name temestudo.cloud www.temestudo.cloud;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /opt/temestudo/acme;
  }

  location / {
    return 301 https://temestudo.cloud$request_uri;
  }
}

# www goes to the domain without www, with the query along: the shared link
# keeps opening the same state.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.temestudo.cloud;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  add_header Referrer-Policy "strict-origin" always;
  return 301 https://temestudo.cloud$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name temestudo.cloud;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  # The app server sends JS as `text/javascript`, which Nginx does not
  # compress without this line (`scripts/measure-pages-meta.test.ts`).
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

  # The app already sends the header on pages (`src/platform/request-log.ts`).
  # Here it also applies to the `public/` files and to Nginx's own error
  # responses. `proxy_hide_header` keeps it from going out twice. An
  # `add_header` inside a `location` erases this block's: whoever declares
  # one there repeats this one.
  proxy_hide_header Referrer-Policy;
  add_header Referrer-Policy "strict-origin" always;

  location / {
    include /etc/nginx/temestudo/temestudo-app.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

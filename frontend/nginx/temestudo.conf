# O Nginx do host da VPS do Tem estudo?, que só serve este site. O deploy
# (`../scripts/vps.ts`) instala este arquivo em
# `/etc/nginx/sites-available/temestudo.conf`, com o link em `sites-enabled/`,
# e só o deixa no ar se o `nginx -t` passar. O app roda num contêiner em
# 127.0.0.1, numa porta do par que o deploy troca (blue/green), e a porta do
# momento vem do include `/etc/nginx/temestudo/temestudo-app.conf`.
#
# O link de compartilhamento leva o Perfil na query (ADR 0001), então nenhum
# log guarda a query: o access_log usa o formato `temestudo_sem_query`
# (`log-sem-query.conf`), com o caminho cortado antes do `?`, e sem o
# Referer. O error_log copia a linha do pedido quando algo falha. Ele fica em
# `/var/log/nginx/temestudo/` e gira todo dia, guardando 3 dias
# (`logrotate-temestudo`). A subpasta tira os dois arquivos do `*.log` do
# `/etc/logrotate.d/nginx` do Ubuntu, que guarda 14 dias. `nginx.test.ts`
# confere tudo isso pelo que está escrito aqui.
#
# O GoatCounter (#35) entra em outro arquivo, `temestudo-stats.conf`, com
# `server_name stats.temestudo.com` e o mesmo access_log. O formato fica no
# `conf.d/`, que o `nginx.conf` do Ubuntu lê antes do `sites-enabled/`, para
# valer em qualquer vhost, na ordem que for.

# Um pedido pelo IP ou por um host que não é o site cai aqui, sem resposta, e
# o log dele também não leva a query. No 443, sem certificado: o handshake é
# recusado.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  listen 443 ssl http2 default_server;
  listen [::]:443 ssl http2 default_server;
  server_name _;
  ssl_reject_handshake on;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  return 444;
}

# O desafio do certbot (webroot) e o resto para o https.
server {
  listen 80;
  listen [::]:80;
  server_name temestudo.com www.temestudo.com;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /opt/temestudo/acme;
  }

  location / {
    return 301 https://temestudo.com$request_uri;
  }
}

# O www vai para o domínio sem www, com a query junto: o link compartilhado
# continua abrindo o mesmo estado.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.temestudo.com;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  add_header Referrer-Policy "strict-origin" always;
  return 301 https://temestudo.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name temestudo.com;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # O app já manda o cabeçalho nas páginas (`src/platform/registro-do-pedido.ts`).
  # Aqui ele vale também para os arquivos do `public/` e para as respostas de
  # erro do próprio Nginx. O `proxy_hide_header` evita que saia duas vezes.
  # Um `add_header` dentro de um `location` apaga os deste bloco: quem
  # declarar um lá repete este.
  proxy_hide_header Referrer-Policy;
  add_header Referrer-Policy "strict-origin" always;

  location / {
    include /etc/nginx/temestudo/temestudo-app.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

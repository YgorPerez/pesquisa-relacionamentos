# O GoatCounter (#35) em stats.temestudo.com. O deploy (`../scripts/vps.ts`)
# instala este arquivo em `/etc/nginx/sites-available/temestudo-stats.conf`,
# com o link em `sites-enabled/`, junto com o `temestudo.conf`. O GoatCounter
# roda num contêiner próprio em 127.0.0.1:3051, com o SQLite num volume.
#
# Os envios do site chegam em `/count?p=…`. A query deles só leva o caminho,
# mas o log segue a regra do site: o formato `temestudo_sem_query`
# (`log-sem-query.conf`) e os mesmos arquivos, girados pelo
# `logrotate-temestudo`. O certificado é o de temestudo.com, que o
# `preparar-vps.sh` tira com o nome stats junto (`tls.conf`).

server {
  listen 80;
  listen [::]:80;
  server_name stats.temestudo.com;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;

  # O default_server do `temestudo.conf` recusa host que não conhece: sem
  # este bloco, o certbot não validaria o nome stats.
  location ^~ /.well-known/acme-challenge/ {
    root /opt/temestudo/acme;
  }

  location / {
    return 301 https://stats.temestudo.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name stats.temestudo.com;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  server_tokens off;
  add_header Referrer-Policy "strict-origin" always;

  location / {
    proxy_pass http://127.0.0.1:3051;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # O GoatCounter tira o país do IP, e o descarta. Só o IP de quem visita,
    # sem a lista que o navegador ou outro proxy possa ter mandado.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

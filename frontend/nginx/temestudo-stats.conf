# GoatCounter (#35) at stats.temestudo.cloud. The deploy (`../scripts/vps.ts`)
# installs this file at `/etc/nginx/sites-available/temestudo-stats.conf`,
# with the link in `sites-enabled/`, together with `temestudo.conf`.
# GoatCounter runs in its own container at 127.0.0.1:3051, with SQLite in a
# volume.
#
# The site's hits arrive at `/count?p=…`. Their query only carries the path,
# but the log follows the site's rule: the `temestudo_sem_query` format
# (`log-without-query.conf`) and the same files, rotated by
# `logrotate-temestudo`. The certificate is temestudo.cloud's, which
# `prepare-vps.sh` gets with the stats name along (`tls.conf`).

server {
  listen 80;
  listen [::]:80;
  server_name stats.temestudo.cloud;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;

  # The default_server in `temestudo.conf` refuses hosts it does not know:
  # without this block, certbot would not validate the stats name.
  location ^~ /.well-known/acme-challenge/ {
    root /opt/temestudo/acme;
  }

  location / {
    return 301 https://stats.temestudo.cloud$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name stats.temestudo.cloud;
  include /etc/nginx/temestudo/tls.conf;
  access_log /var/log/nginx/temestudo/access.log temestudo_sem_query;
  error_log /var/log/nginx/temestudo/error.log;
  server_tokens off;
  add_header Referrer-Policy "strict-origin" always;

  location / {
    proxy_pass http://127.0.0.1:3051;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # GoatCounter takes the country from the IP, and discards it. Only the
    # visitor's IP, without the list the browser or another proxy may have
    # sent.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

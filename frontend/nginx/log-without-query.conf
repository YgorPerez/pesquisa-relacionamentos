# The access_log format of every vhost of the site (ADR 0001). The deploy
# installs this file at `/etc/nginx/conf.d/temestudo-log-sem-query.conf`,
# which Ubuntu's `nginx.conf` includes inside `http`, before
# `sites-enabled/`.
#
# The path is the request cut before the first `?`. Left out are
# `$request`, `$request_uri`, `$args` and `$http_referer`, which carry the
# link's query or the address the visitor came from. The variable and format
# names stay as the live server knows them.
map $request_uri $temestudo_caminho {
  default "-";
  "~^(?<temestudo_sem_query>[^?]*)" $temestudo_sem_query;
}

log_format temestudo_sem_query '$remote_addr [$time_local] "$request_method $temestudo_caminho $server_protocol" $status $body_bytes_sent $request_time "$host"';

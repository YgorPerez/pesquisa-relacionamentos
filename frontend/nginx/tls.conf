# The TLS of the 443 `server` blocks in `temestudo.conf`, with certbot's
# certificate (webroot). Certbot's `options-ssl-nginx.conf` only exists when
# its Nginx plugin runs, and here it does not. The deploy installs this file
# at `/etc/nginx/temestudo/tls.conf`.
ssl_certificate /etc/letsencrypt/live/temestudo.cloud/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/temestudo.cloud/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:temestudo_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

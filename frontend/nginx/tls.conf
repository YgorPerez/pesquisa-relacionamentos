# O TLS dos `server` 443 de `temestudo.conf`, com o certificado do certbot
# (webroot). O `options-ssl-nginx.conf` do certbot só existe quando o plugin
# do Nginx roda, e aqui ele não roda. O deploy instala este arquivo em
# `/etc/nginx/temestudo/tls.conf`.
ssl_certificate /etc/letsencrypt/live/temestudo.cloud/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/temestudo.cloud/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:temestudo_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

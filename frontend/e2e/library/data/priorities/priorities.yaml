# Fixture do e2e: os degraus do rascunho de verdade
# (dados/prioridades/_prioridades.yaml), com as Fichas trocadas pelas da
# fixture, uma ✅ (silva-2020) e uma 🟡 (costa-2018).
satisfacao_explicada: { ficha: silva-2020-apps-brasil, relacao: 45, parceiro: 5, sem_explicacao: 50 }

caracteristicas:
  - id: aparencia
    nome: Aparência
    atracao: { degrau: 3, medida: "r ≈ 0,40", texto_simples: "Quem é mais bonito atrai mais.", ficha: silva-2020-apps-brasil }
    satisfacao: { degrau: 2, medida: "r = 0,10, só maridos", texto_simples: "Só os maridos ficam um pouco mais satisfeitos, e só no começo.", ficha: costa-2018-satisfacao }
    duracao: { degrau: 0, texto_simples: "Nenhum estudo lido mede isso." }
    vies: { todos: "As pessoas dão menos peso à aparência quando dizem o que querem do que quando se atraem." }
  - id: sexo
    nome: Química sexual
    atracao: { degrau: 3, texto_simples: "É o que mais pesa no que as pessoas revelam.", ficha: silva-2020-apps-brasil }
